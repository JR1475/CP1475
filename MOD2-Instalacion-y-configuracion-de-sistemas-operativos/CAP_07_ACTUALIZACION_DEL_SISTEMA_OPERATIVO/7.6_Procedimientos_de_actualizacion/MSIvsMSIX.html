<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparativa: MSI vs MSIX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            width: 95%;
            max-width: 1000px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* --- VARIABLES --- */
        :root {
            --anim-time: 8s;
        }

        /* --- TEXT STYLES --- */
        .header-title { font-size: 22px; font-weight: bold; fill: #334155; text-anchor: middle; }
        .col-title { font-size: 18px; font-weight: bold; text-anchor: middle; }
        .label { font-size: 11px; fill: #64748b; text-anchor: middle; }
        .small-label { font-size: 9px; fill: #94a3b8; text-anchor: middle; }
        .status-text { font-size: 12px; font-weight: bold; text-anchor: middle; fill: white; }

        /* --- SYSTEM BASE STYLES --- */
        .os-core { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2; }
        .registry-block { fill: #cbd5e1; stroke: #64748b; stroke-width: 1; }
        
        /* --- MSI ELEMENTS (Left) --- */
        .msi-file { fill: #3b82f6; } /* Blue */
        .msi-junk { fill: #ef4444; opacity: 0; } /* Red Residue */
        
        /* --- MSIX ELEMENTS (Right) --- */
        .msix-container { 
            fill: none; 
            stroke: #8b5cf6; /* Purple */
            stroke-width: 2; 
            stroke-dasharray: 5,5;
            opacity: 0;
        }
        .msix-file { fill: #8b5cf6; }
        .virtual-reg { fill: #ddd6fe; stroke: #8b5cf6; opacity: 0; }

        /* --- ANIMATIONS --- */

        /* 1. MSI ANIMATIONS */
        /* Files scattering into System */
        .anim-msi-scatter {
            animation: msiScatter var(--anim-time) ease-in-out infinite;
        }
        /* Registry writes */
        .anim-msi-reg {
            animation: msiRegWrite var(--anim-time) ease-in-out infinite;
        }
        /* Uninstall leaving junk */
        .anim-msi-residue {
            animation: msiResidue var(--anim-time) steps(1) infinite;
        }

        /* 2. MSIX ANIMATIONS */
        /* Container appearing */
        .anim-msix-container {
            animation: msixContainerShow var(--anim-time) steps(1) infinite;
        }
        /* Files entering container */
        .anim-msix-move {
            animation: msixMove var(--anim-time) ease-in-out infinite;
        }
        /* Virtual Reg appearing */
        .anim-msix-vreg {
            animation: msixVRegShow var(--anim-time) steps(1) infinite;
        }

        /* --- KEYFRAMES --- */

        /* MSI SEQUENCE */
        @keyframes msiScatter {
            0% { transform: translate(0, 0); opacity: 1; } /* Start in package */
            10% { transform: translate(0, 0); opacity: 1; }
            20% { transform: translate(-40px, 80px); } /* Move to System32 */
            30% { transform: translate(40px, 120px); } /* Move to Program Files */
            70% { opacity: 1; } /* Stay installed */
            80% { opacity: 0; transform: translate(0, -100px); } /* Uninstall (Fly away) */
            100% { opacity: 0; }
        }

        @keyframes msiRegWrite {
            0%, 25% { opacity: 0; }
            30% { opacity: 1; transform: translateY(0); } /* Write to real registry */
            75% { opacity: 1; }
            80% { opacity: 0; } /* Key deleted? Maybe not */
            100% { opacity: 0; }
        }

        @keyframes msiResidue {
            0%, 79% { opacity: 0; }
            80% { opacity: 1; } /* Junk appears after uninstall */
            95% { opacity: 1; }
            100% { opacity: 0; } /* Reset loop */
        }

        /* MSIX SEQUENCE */
        @keyframes msixContainerShow {
            0%, 10% { opacity: 0; }
            15% { opacity: 1; } /* Container created */
            75% { opacity: 1; }
            80% { opacity: 0; } /* Container deleted cleanly */
            100% { opacity: 0; }
        }

        @keyframes msixMove {
            0% { transform: translate(0, 0); opacity: 1; }
            15% { transform: translate(0, 60px); } /* Move INSIDE container */
            75% { opacity: 1; transform: translate(0, 60px); }
            80% { opacity: 0; } /* Disappears with container */
            100% { opacity: 0; }
        }

        @keyframes msixVRegShow {
            0%, 20% { opacity: 0; }
            25% { opacity: 1; } /* VREG active */
            75% { opacity: 1; }
            80% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Phase Text Indicator */
        .phase-text { animation: phaseChange var(--anim-time) steps(1) infinite; fill: #64748b; font-weight: bold; font-size: 14px; text-anchor: middle; }
        
        @keyframes phaseChange {
            0% { opacity: 0; }
            5% { opacity: 1; content: "Fase 1: Instalación"; }
            35% { opacity: 1; content: "Fase 2: Ejecución"; }
            75% { opacity: 1; content: "Fase 3: Desinstalación"; }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">

        <!-- Header -->
        <text x="400" y="40" class="header-title">ARQUITECTURA DE EMPAQUETADO WINDOWS</text>
        <line x1="50" y1="55" x2="750" y2="55" stroke="#e2e8f0" stroke-width="2" />

        <!-- Phase Indicator -->
        <text x="400" y="80" class="phase-text">Ciclo de Vida</text>

        <!-- ================= LEFT SIDE: MSI (TRADITIONAL) ================= -->
        <g transform="translate(200, 100)">
            <text x="0" y="0" class="col-title" fill="#3b82f6">MSI (Clásico)</text>
            <text x="0" y="20" class="label">Instalación Directa</text>

            <!-- OS Representation -->
            <rect x="-80" y="150" width="160" height="120" rx="5" class="os-core" />
            <text x="0" y="260" class="label" font-weight="bold">SISTEMA OPERATIVO</text>

            <!-- Shared Registry -->
            <rect x="-60" y="170" width="120" height="20" rx="2" class="registry-block" />
            <text x="0" y="184" class="small-label">REGISTRO DE WINDOWS (Compartido)</text>

            <!-- MSI Package Source -->
            <g transform="translate(0, 50)">
                <rect x="-15" y="-20" width="30" height="40" rx="2" fill="#3b82f6" />
                <text x="0" y="5" fill="white" font-size="10" text-anchor="middle" font-weight="bold">.msi</text>
            </g>

            <!-- Animated Files (Scatter) -->
            <circle r="5" class="msi-file anim-msi-scatter" transform="translate(0, 50)" />
            <circle r="5" class="msi-file anim-msi-scatter" transform="translate(0, 50)" style="animation-delay: 0.1s; animation-duration: 8.1s" />
            
            <!-- Registry Write Arrow -->
            <path d="M 0 130 L 0 165" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" class="anim-msi-reg" />

            <!-- Residue (Junk) -->
            <g class="anim-msi-residue">
                <path d="M -40 200 l 5 5 m -5 -5 l 5 -5" stroke="#ef4444" stroke-width="2" /> <!-- X mark -->
                <path d="M 40 220 l 5 5 m -5 -5 l 5 -5" stroke="#ef4444" stroke-width="2" /> <!-- X mark -->
                <circle cx="0" cy="170" r="3" fill="#ef4444" /> <!-- Reg junk -->
                <text x="0" y="290" fill="#ef4444" font-weight="bold" font-size="12" text-anchor="middle">RESIDUOS / DLL HELL</text>
            </g>
        </g>

        <!-- Divider -->
        <line x1="400" y1="100" x2="400" y2="350" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5" />

        <!-- ================= RIGHT SIDE: MSIX (MODERN) ================= -->
        <g transform="translate(600, 100)">
            <text x="0" y="0" class="col-title" fill="#8b5cf6">MSIX (Moderno)</text>
            <text x="0" y="20" class="label">Contenedor / Virtualización</text>

            <!-- OS Representation -->
            <rect x="-80" y="150" width="160" height="120" rx="5" class="os-core" />
            <text x="0" y="260" class="label" font-weight="bold">SISTEMA OPERATIVO</text>

             <!-- Shared Registry (Untouched) -->
             <rect x="-60" y="170" width="120" height="20" rx="2" class="registry-block" opacity="0.5" />
             <text x="0" y="184" class="small-label">REGISTRO (Intacto)</text>

            <!-- MSIX Package Source -->
            <g transform="translate(0, 50)">
                <rect x="-15" y="-20" width="30" height="40" rx="2" fill="#8b5cf6" />
                <text x="0" y="5" fill="white" font-size="10" text-anchor="middle" font-weight="bold">.msix</text>
            </g>

            <!-- The Container (Bubble) -->
            <rect x="-50" y="130" width="100" height="100" rx="10" class="msix-container anim-msix-container" />
            
            <!-- Virtual Registry -->
            <g class="anim-msix-vreg">
                <rect x="-40" y="140" width="80" height="15" rx="2" class="virtual-reg" />
                <text x="0" y="151" fill="#6d28d9" font-size="8" text-anchor="middle" font-weight="bold">REG VIRTUAL (user.dat)</text>
            </g>

            <!-- Animated Files (Contained) -->
            <circle r="5" class="msix-file anim-msix-move" transform="translate(0, 50)" />
            <circle r="5" class="msix-file anim-msix-move" transform="translate(10, 50)" style="animation-delay: 0.1s;" />

            <!-- Clean Uninstall Text -->
            <text x="0" y="290" class="anim-msi-residue" fill="#10b981" font-weight="bold" font-size="12" text-anchor="middle">100% LIMPIO</text>

        </g>

        <!-- ================= LEGEND / SUMMARY ================= -->
        <g transform="translate(50, 380)">
            <!-- MSI Box -->
            <rect x="0" y="0" width="340" height="50" rx="5" fill="#eff6ff" stroke="#3b82f6" />
            <text x="10" y="20" font-size="12" font-weight="bold" fill="#1e3a8a">MSI (Windows Installer)</text>
            <text x="10" y="35" font-size="10" fill="#1e3a8a">Modifica el sistema globalmente. Difícil de desinstalar por completo.</text>
            
            <!-- MSIX Box -->
            <rect x="360" y="0" width="340" height="50" rx="5" fill="#f5f3ff" stroke="#8b5cf6" />
            <text x="370" y="20" font-size="12" font-weight="bold" fill="#5b21b6">MSIX (Container)</text>
            <text x="370" y="35" font-size="10" fill="#5b21b6">Aislado. Registro Virtual. Desinstalación limpia garantizada.</text>
        </g>

        <!-- Defs -->
        <defs>
            <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
            </marker>
        </defs>

    </svg>
</div>

</body>
</html>
