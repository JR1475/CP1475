<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos Universales de Instalación de SO</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            width: 95%;
            max-width: 1000px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* --- STYLES --- */
        .title { font-size: 22px; font-weight: bold; fill: #334155; text-anchor: middle; }
        .section-title { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #475569; text-transform: uppercase; letter-spacing: 1px; }
        .label { font-size: 10px; fill: #64748b; text-anchor: middle; }
        
        /* --- ANIMATIONS --- */
        
        /* 1. SOURCE MORPHING (USB -> ISO -> CLOUD) */
        .source-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        /* 2. BOOTLOADER HANDSHAKE */
        .boot-line {
            stroke-dasharray: 10;
            animation: dash 1s linear infinite;
        }

        /* 3. DISK FORMATTING */
        .disk-grid {
            opacity: 0;
            animation: gridAppear 4s linear infinite;
        }
        .disk-wipe {
            animation: wipe 4s ease-in-out infinite;
        }

        /* 4. DATA TRANSFER */
        .data-stream {
            stroke-dasharray: 5;
            animation: dash 0.5s linear infinite;
            opacity: 0.6;
        }

        /* 5. KERNEL PULSE */
        .kernel-core {
            animation: pulse 2s infinite;
            transform-origin: center;
        }

        /* Keyframes */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        
        @keyframes dash { to { stroke-dashoffset: -20; } }

        @keyframes wipe {
            0%, 20% { width: 0; opacity: 0; } /* Start clean */
            30% { width: 80px; opacity: 1; fill: #ef4444; } /* Wipe (Red/Delete) */
            40% { width: 80px; opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes gridAppear {
            0%, 40% { opacity: 0; }
            45% { opacity: 1; } /* New Partition Table */
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* OS LOGO SWITCHER */
        .os-logo-win { opacity: 0; animation: showOs 12s infinite; animation-delay: 0s; }
        .os-logo-lin { opacity: 0; animation: showOs 12s infinite; animation-delay: 4s; }
        .os-logo-mac { opacity: 0; animation: showOs 12s infinite; animation-delay: 8s; }

        @keyframes showOs {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(0); }
            40% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">

        <!-- TITLE -->
        <text x="400" y="40" class="title">ANATOMÍA DE UNA INSTALACIÓN (UNIVERSAL)</text>
        <line x1="100" y1="55" x2="700" y2="55" stroke="#e2e8f0" stroke-width="2" />

        <!-- ================= 1. SOURCE (ORIGEN) ================= -->
        <g transform="translate(100, 150)">
            <text x="50" y="-40" class="section-title">1. MEDIO / FUENTE</text>
            
            <!-- Circle BG -->
            <circle cx="50" cy="50" r="60" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- Animated Icons (Abstract representation of source) -->
            <g class="source-icon">
                <rect x="35" y="20" width="30" height="40" fill="#3b82f6" rx="2"/> <!-- USB/ISO -->
                <path d="M 35 60 L 65 60 L 50 80 Z" fill="#0ea5e9"/> <!-- Arrow -->
                <text x="50" y="45" fill="white" font-size="10" text-anchor="middle" font-weight="bold">ISO/IMG</text>
            </g>
            
            <text x="50" y="130" class="label">Imagen Binaria</text>
            <text x="50" y="145" class="label">(USB, DVD, ROM, Nube)</text>
        </g>

        <!-- CONNECTION 1: BOOT -->
        <line x1="160" y1="200" x2="240" y2="200" stroke="#94a3b8" stroke-width="4" />
        <line x1="160" y1="200" x2="240" y2="200" stroke="#3b82f6" stroke-width="4" class="boot-line" />
        <text x="200" y="190" font-size="10" fill="#64748b" text-anchor="middle">BOOT</text>

        <!-- ================= 2. BOOTLOADER (INTERMEDIARIO) ================= -->
        <g transform="translate(240, 150)">
            <text x="60" y="-40" class="section-title" fill="#d97706">2. ARRANQUE</text>
            
            <!-- Chip Shape -->
            <rect x="10" y="10" width="100" height="80" fill="#1e293b" rx="5"/>
            <rect x="20" y="20" width="80" height="60" fill="#334155" />
            
            <!-- Pins -->
            <path d="M 10 20 H 0 M 10 30 H 0 M 10 40 H 0 M 10 50 H 0 M 10 60 H 0 M 10 70 H 0 M 10 80 H 0" stroke="#94a3b8" stroke-width="2"/>
            <path d="M 110 20 H 120 M 110 30 H 120 M 110 40 H 120 M 110 50 H 120 M 110 60 H 120 M 110 70 H 120 M 110 80 H 120" stroke="#94a3b8" stroke-width="2"/>

            <text x="60" y="50" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">FIRMWARE</text>
            <text x="60" y="65" fill="#94a3b8" font-size="8" text-anchor="middle">BIOS / UEFI / iBoot</text>

            <text x="60" y="130" class="label">Inicializa Hardware</text>
            <text x="60" y="145" class="label">Carga Instalador a RAM</text>
        </g>

        <!-- CONNECTION 2: INSTALL -->
        <line x1="360" y1="200" x2="440" y2="200" stroke="#94a3b8" stroke-width="4" />
        <line x1="360" y1="200" x2="440" y2="200" stroke="#22c55e" stroke-width="4" class="data-stream" />
        <text x="400" y="190" font-size="10" fill="#64748b" text-anchor="middle">COPIA</text>

        <!-- ================= 3. STORAGE (DESTINO) ================= -->
        <g transform="translate(440, 150)">
            <text x="50" y="-40" class="section-title" fill="#059669">3. DISCO</text>
            
            <!-- HDD/SSD Shape -->
            <rect x="0" y="0" width="100" height="100" fill="#f1f5f9" stroke="#475569" stroke-width="2" rx="5"/>
            
            <!-- Wipe Animation (Red bar) -->
            <rect x="10" y="10" height="80" class="disk-wipe" fill="#ef4444" opacity="0.5" />
            
            <!-- Partition Grid (Green lines) -->
            <g class="disk-grid">
                <rect x="10" y="10" width="80" height="20" fill="#dcfce7" stroke="#22c55e"/> <!-- EFI -->
                <text x="50" y="25" font-size="8" fill="#166534" text-anchor="middle">EFI / BOOT</text>

                <rect x="10" y="35" width="80" height="55" fill="#dcfce7" stroke="#22c55e"/> <!-- OS -->
                <text x="50" y="65" font-size="10" fill="#166534" text-anchor="middle" font-weight="bold">SISTEMA (OS)</text>
            </g>

            <text x="50" y="130" class="label">Particionado & Formato</text>
            <text x="50" y="145" class="label">(NTFS, EXT4, APFS)</text>
        </g>

        <!-- CONNECTION 3: BOOTLOADER CONFIG -->
        <path d="M 540 200 L 580 200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2,2" />

        <!-- ================= 4. RESULT (SISTEMA) ================= -->
        <g transform="translate(580, 130)">
            <text x="60" y="-20" class="section-title" fill="#6366f1">4. RESULTADO</text>

            <!-- Computer Screen -->
            <rect x="0" y="0" width="120" height="90" fill="#1e293b" rx="5" />
            <rect x="5" y="5" width="110" height="80" fill="#0f172a" />
            
            <!-- OS Logos (Cycling) -->
            <g transform="translate(60, 45)">
                <g class="os-logo-win">
                    <path d="M -15 -15 H -1 V -1 H -15 Z M 1 -15 H 15 V -1 H 1 Z M -15 1 H -1 V 15 H -15 Z M 1 1 H 15 V 15 H 1 Z" fill="#0ea5e9"/>
                </g>
                <g class="os-logo-lin">
                    <circle r="15" fill="#fbbf24" />
                    <text x="0" y="5" font-size="10" text-anchor="middle" fill="#000">LINUX</text>
                </g>
                <g class="os-logo-mac">
                    <circle r="15" fill="#a3a3a3" />
                    <text x="0" y="5" font-size="10" text-anchor="middle" fill="white">macOS</text>
                </g>
            </g>

            <!-- Kernel Core -->
            <circle cx="60" cy="45" r="25" fill="none" stroke="#6366f1" stroke-width="2" class="kernel-core" opacity="0.5"/>

            <text x="60" y="110" class="label">Bootloader Configurado</text>
            <text x="60" y="125" class="label">Kernel + Drivers Listos</text>
        </g>

        <!-- FOOTER LEGEND -->
        <g transform="translate(150, 350)">
            <rect x="0" y="0" width="500" height="60" fill="#f8fafc" rx="5" stroke="#e2e8f0"/>
            
            <text x="20" y="20" font-size="12" font-weight="bold" fill="#334155">Resumen del Proceso:</text>
            
            <circle cx="30" cy="40" r="3" fill="#3b82f6"/>
            <text x="40" y="43" font-size="10" fill="#475569">1. El Firmware carga el medio de instalación en RAM.</text>

            <circle cx="250" cy="40" r="3" fill="#ef4444"/>
            <text x="260" y="43" font-size="10" fill="#475569">2. El Instalador prepara el disco (Particiones).</text>

            <circle cx="30" cy="55" r="3" fill="#22c55e"/>
            <text x="40" y="58" font-size="10" fill="#475569">3. Se descomprimen los archivos del SO.</text>

            <circle cx="250" cy="55" r="3" fill="#6366f1"/>
            <text x="260" y="58" font-size="10" fill="#475569">4. Se inyecta el Bootloader para arrancar sin el USB.</text>
        </g>

    </svg>
</div>

</body>
</html>
