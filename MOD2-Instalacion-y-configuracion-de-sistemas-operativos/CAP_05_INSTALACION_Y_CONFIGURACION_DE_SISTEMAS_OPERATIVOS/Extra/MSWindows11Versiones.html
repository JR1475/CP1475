<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalación Windows 11: Comparativa de Ediciones</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            width: 98%;
            max-width: 1100px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* --- ANIMATION VARIABLES --- */
        :root {
            --flow-speed: 3s;
        }

        /* --- TEXT STYLES --- */
        .header-text { font-size: 20px; font-weight: bold; fill: #334155; text-anchor: middle; }
        .col-title { font-size: 14px; font-weight: bold; text-anchor: middle; }
        .label-text { font-size: 10px; fill: #64748b; text-anchor: middle; }
        .status-text { font-size: 11px; font-weight: bold; text-anchor: middle; fill: white; }

        /* --- COMPONENT STYLES --- */
        .usb-stick { fill: #3b82f6; stroke: #1e3a8a; stroke-width: 2; }
        .pc-screen { fill: #1e293b; stroke: #475569; stroke-width: 2; }
        .pc-stand { fill: #94a3b8; }
        
        /* Nodes */
        .cloud-node { fill: #0ea5e9; opacity: 0.1; stroke: #0284c7; stroke-width: 1; }
        .local-node { fill: #f59e0b; opacity: 0.1; stroke: #d97706; stroke-width: 1; }
        .edu-node { fill: #10b981; opacity: 0.1; stroke: #059669; stroke-width: 1; }
        .corp-node { fill: #6366f1; opacity: 0.1; stroke: #4f46e5; stroke-width: 1; }

        /* Active Node Highlights (Animation) */
        .node-active-home { animation: pulseHome 4s infinite; }
        .node-active-pro-ms { animation: pulseHome 4s infinite; }
        .node-active-pro-loc { animation: pulseLocal 4s infinite; }
        .node-active-edu { animation: pulseEdu 4s infinite; }
        .node-active-ent { animation: pulseEnt 4s infinite; }

        /* --- DATA PACKETS --- */
        .packet {
            r: 4;
            fill: white;
            stroke-width: 1;
        }
        
        /* Paths */
        .path-line { fill: none; stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 4 4; }
        
        /* --- ANIMATIONS --- */
        
        /* 1. HOME FLOW */
        .flow-home { animation: moveHome 4s linear infinite; fill: #0ea5e9; }
        
        /* 2. PRO FLOW (Split) */
        .flow-pro-1 { animation: moveProCloud 8s linear infinite; fill: #0ea5e9; } /* Cycle 1: Cloud */
        .flow-pro-2 { animation: moveProLocal 8s linear infinite; fill: #f59e0b; animation-delay: 4s; opacity: 0; } /* Cycle 2: Local */

        /* 3. EDU FLOW */
        .flow-edu { animation: moveEdu 4s linear infinite; fill: #10b981; }

        /* 4. ENT FLOW */
        .flow-ent { animation: moveEnt 4s linear infinite; fill: #6366f1; }

        /* Keyframes for Movement */
        /* Note: Using simplified transforms for readability */
        
        @keyframes moveHome {
            0% { transform: translate(200px, 60px); opacity: 1; } /* Start USB */
            20% { transform: translate(200px, 120px); } /* To PC */
            40% { transform: translate(200px, 220px); } /* To Cloud */
            60% { transform: translate(200px, 220px) scale(1.5); } /* Process */
            80% { transform: translate(200px, 120px); } /* Back to PC */
            100% { transform: translate(200px, 120px); opacity: 0; }
        }

        /* Pro Logic: Cloud First */
        @keyframes moveProCloud {
            0% { transform: translate(400px, 60px); opacity: 1; }
            20% { transform: translate(400px, 120px); }
            30% { transform: translate(370px, 150px); } /* Branch Left */
            40% { transform: translate(370px, 220px); } /* To Cloud */
            60% { transform: translate(370px, 220px) scale(1.5); }
            80% { transform: translate(400px, 120px); }
            90% { transform: translate(400px, 120px); opacity: 0; }
            100% { opacity: 0; }
        }
        /* Pro Logic: Local Second */
        @keyframes moveProLocal {
            0% { transform: translate(400px, 60px); opacity: 1; }
            20% { transform: translate(400px, 120px); }
            30% { transform: translate(430px, 150px); } /* Branch Right */
            40% { transform: translate(430px, 220px); } /* To Local Lock */
            60% { transform: translate(430px, 220px) scale(1.5); }
            80% { transform: translate(400px, 120px); }
            90% { transform: translate(400px, 120px); opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes moveEdu {
            0% { transform: translate(600px, 60px); opacity: 1; }
            20% { transform: translate(600px, 120px); }
            40% { transform: translate(600px, 220px); } /* To School */
            60% { transform: translate(600px, 220px) scale(1.5); }
            80% { transform: translate(600px, 120px); }
            100% { transform: translate(600px, 120px); opacity: 0; }
        }

        @keyframes moveEnt {
            0% { transform: translate(800px, 60px); opacity: 1; }
            20% { transform: translate(800px, 120px); }
            40% { transform: translate(800px, 220px); } /* To Corp */
            60% { transform: translate(800px, 220px) scale(1.5); }
            80% { transform: translate(800px, 120px); }
            100% { transform: translate(800px, 120px); opacity: 0; }
        }

        /* Pulse Effects */
        @keyframes pulseHome { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.5; } }
        @keyframes pulseLocal { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.8; } }
        @keyframes pulseEdu { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.5; } }
        @keyframes pulseEnt { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.5; } }

        /* Screen Content Switching */
        .screen-home { animation: contentHome 4s steps(1) infinite; }
        .screen-pro { animation: contentPro 8s steps(1) infinite; }
        .screen-edu { animation: contentEdu 4s steps(1) infinite; }
        .screen-ent { animation: contentEnt 4s steps(1) infinite; }

        @keyframes contentHome { 0%, 70% { fill: #1e293b; } 71% { fill: #0ea5e9; } }
        @keyframes contentPro { 
            0%, 35% { fill: #1e293b; } 36%, 49% { fill: #0ea5e9; } /* Cloud phase */
            50%, 85% { fill: #1e293b; } 86%, 100% { fill: #f59e0b; } /* Local phase */
        }
        @keyframes contentEdu { 0%, 70% { fill: #1e293b; } 71% { fill: #10b981; } }
        @keyframes contentEnt { 0%, 70% { fill: #1e293b; } 71% { fill: #6366f1; } }

    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
        
        <!-- Header -->
        <text x="500" y="35" class="header-text">INSTALACIÓN WINDOWS 11: MATRIZ DE EDICIONES</text>
        <line x1="50" y1="50" x2="950" y2="50" stroke="#e2e8f0" stroke-width="2"/>

        <!-- SOURCE: Installation Media -->
        <g transform="translate(480, 10)">
             <rect x="0" y="0" width="40" height="30" rx="2" fill="#3b82f6" />
             <rect x="10" y="30" width="20" height="10" fill="#cbd5e1" />
             <text x="50" y="20" font-size="10" fill="#64748b" text-anchor="start">ISO / USB</text>
        </g>

        <!-- ================= COLUMN 1: HOME ================= -->
        <g transform="translate(200, 80)">
            <text x="0" y="-10" class="col-title" fill="#0ea5e9">HOME</text>
            
            <!-- PC -->
            <rect x="-40" y="20" width="80" height="50" rx="3" class="pc-screen"/>
            <rect x="-35" y="25" width="70" height="40" class="screen-home"/>
            <path d="M -10 70 L 10 70 L 15 80 L -15 80 Z" class="pc-stand"/>
            
            <!-- Path -->
            <line x1="0" y1="80" x2="0" y2="140" class="path-line" />

            <!-- Cloud Node -->
            <circle cx="0" cy="140" r="30" class="cloud-node node-active-home" />
            <text x="0" y="145" font-family="Arial" font-size="20" fill="#0284c7" text-anchor="middle">☁️</text>
            <text x="0" y="185" class="label-text">Cuenta Microsoft</text>
            <text x="0" y="195" class="label-text" font-weight="bold" fill="#dc2626 !important">Obligatoria</text>

            <!-- Result Text -->
            <text x="0" y="250" class="label-text">Uso Personal</text>
        </g>

        <!-- ================= COLUMN 2: PRO ================= -->
        <g transform="translate(400, 80)">
            <text x="0" y="-10" class="col-title" fill="#8b5cf6">PRO</text>
            
            <!-- PC -->
            <rect x="-40" y="20" width="80" height="50" rx="3" class="pc-screen"/>
            <rect x="-35" y="25" width="70" height="40" class="screen-pro"/>
            <path d="M -10 70 L 10 70 L 15 80 L -15 80 Z" class="pc-stand"/>
            
            <!-- Fork Paths -->
            <path d="M 0 80 L 0 100 L -30 120 L -30 140" class="path-line" />
            <path d="M 0 80 L 0 100 L 30 120 L 30 140" class="path-line" />
            
            <!-- Node A: Cloud -->
            <circle cx="-30" cy="140" r="25" class="cloud-node node-active-pro-ms" />
            <text x="-30" y="145" font-size="16" text-anchor="middle">☁️</text>
            
            <!-- Node B: Local -->
            <circle cx="30" cy="140" r="25" class="local-node node-active-pro-loc" />
            <text x="30" y="145" font-size="16" text-anchor="middle">👤</text>

            <text x="0" y="185" class="label-text">Elige: Personal o Trabajo</text>
            <text x="0" y="195" class="label-text" font-weight="bold" fill="#f59e0b !important">Permite Cuenta Local</text>
            
            <!-- Label for toggling state -->
            <text x="0" y="230" font-size="9" fill="#64748b" text-anchor="middle">(Sin Internet)</text>
        </g>

        <!-- ================= COLUMN 3: EDUCATION ================= -->
        <g transform="translate(600, 80)">
            <text x="0" y="-10" class="col-title" fill="#10b981">EDUCATION</text>
            
            <!-- PC -->
            <rect x="-40" y="20" width="80" height="50" rx="3" class="pc-screen"/>
            <rect x="-35" y="25" width="70" height="40" class="screen-edu"/>
            <path d="M -10 70 L 10 70 L 15 80 L -15 80 Z" class="pc-stand"/>
            
            <!-- Path -->
            <line x1="0" y1="80" x2="0" y2="140" class="path-line" />

            <!-- Edu Node -->
            <circle cx="0" cy="140" r="30" class="edu-node node-active-edu" />
            <text x="0" y="145" font-size="20" text-anchor="middle">🎓</text>
            
            <text x="0" y="185" class="label-text">Cuenta Educativa</text>
            <text x="0" y="195" class="label-text">Apps de Clase / MDM</text>
        </g>

        <!-- ================= COLUMN 4: ENTERPRISE ================= -->
        <g transform="translate(800, 80)">
            <text x="0" y="-10" class="col-title" fill="#6366f1">ENTERPRISE</text>
            
            <!-- PC -->
            <rect x="-40" y="20" width="80" height="50" rx="3" class="pc-screen"/>
            <rect x="-35" y="25" width="70" height="40" class="screen-ent"/>
            <path d="M -10 70 L 10 70 L 15 80 L -15 80 Z" class="pc-stand"/>
            
            <!-- Path -->
            <line x1="0" y1="80" x2="0" y2="140" class="path-line" />

            <!-- Corp Node -->
            <circle cx="0" cy="140" r="30" class="corp-node node-active-ent" />
            <text x="0" y="145" font-size="20" text-anchor="middle">🏢</text>
            
            <text x="0" y="185" class="label-text">Dominio Corporativo</text>
            <text x="0" y="195" class="label-text">Active Directory / Azure AD</text>
        </g>

        <!-- ================= ANIMATED PACKETS ================= -->
        
        <!-- Home Packet -->
        <circle class="packet flow-home" />

        <!-- Pro Packet 1 (Cloud) -->
        <circle class="packet flow-pro-1" />
        <!-- Pro Packet 2 (Local) -->
        <circle class="packet flow-pro-2" />

        <!-- Edu Packet -->
        <circle class="packet flow-edu" />

        <!-- Ent Packet -->
        <circle class="packet flow-ent" />

        <!-- ================= INFO BOXES (Bottom) ================= -->
        <g transform="translate(0, 300)">
            <rect x="150" y="0" width="100" height="60" rx="5" fill="#0ea5e9" opacity="0.9"/>
            <text x="200" y="20" class="status-text">HOME</text>
            <text x="200" y="35" font-size="9" fill="white" text-anchor="middle">Bloatware común</text>
            <text x="200" y="45" font-size="9" fill="white" text-anchor="middle">Cifrado limitado</text>

            <rect x="350" y="0" width="100" height="60" rx="5" fill="#8b5cf6" opacity="0.9"/>
            <text x="400" y="20" class="status-text">PRO</text>
            <text x="400" y="35" font-size="9" fill="white" text-anchor="middle">BitLocker</text>
            <text x="400" y="45" font-size="9" fill="white" text-anchor="middle">RDP / Hyper-V</text>

            <rect x="550" y="0" width="100" height="60" rx="5" fill="#10b981" opacity="0.9"/>
            <text x="600" y="20" class="status-text">EDUCATION</text>
            <text x="600" y="35" font-size="9" fill="white" text-anchor="middle">Sin Cortana/Ads</text>
            <text x="600" y="45" font-size="9" fill="white" text-anchor="middle">Seguridad Enterprise</text>

            <rect x="750" y="0" width="100" height="60" rx="5" fill="#6366f1" opacity="0.9"/>
            <text x="800" y="20" class="status-text">ENTERPRISE</text>
            <text x="800" y="35" font-size="9" fill="white" text-anchor="middle">DirectAccess</text>
            <text x="800" y="45" font-size="9" fill="white" text-anchor="middle">AppLocker / LTSC</text>
        </g>

    </svg>
</div>

</body>
</html>
