<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discos Básicos vs Dinámicos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a; /* Slate 900 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            width: 95%;
            max-width: 1000px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* --- VARIABLES --- */
        :root {
            --anim-speed: 6s;
        }

        /* --- TEXT STYLES --- */
        .header-title { font-size: 22px; font-weight: bold; fill: #334155; text-anchor: middle; }
        .col-title { font-size: 18px; font-weight: bold; text-anchor: middle; }
        .label { font-size: 11px; fill: #64748b; text-anchor: middle; }
        .disk-label { font-size: 10px; fill: #94a3b8; font-weight: bold; }
        .vol-text { font-size: 12px; font-weight: bold; fill: white; text-anchor: middle; }
        .error-text { font-size: 14px; font-weight: bold; fill: #ef4444; text-anchor: middle; opacity: 0; }

        /* --- SHAPES --- */
        .disk-body { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 5; }
        
        /* Basic Partition Colors (Blue standard) */
        .part-basic { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 1; }
        .part-blocked { fill: #94a3b8; stroke: #64748b; stroke-width: 1; stroke-dasharray: 4 4; }

        /* Dynamic Volume Colors (Green/Olive standard for spanned/striped) */
        .vol-dynamic { fill: #d97706; stroke: #b45309; stroke-width: 1; } /* Spanned usually purple/olive, using gold for visibility */
        .vol-link { stroke: #d97706; stroke-width: 4; stroke-dasharray: 5 5; fill: none; }

        /* --- ANIMATIONS --- */
        
        /* BASIC: The Blocked Expansion */
        .expand-arrow {
            animation: hitWall var(--anim-speed) ease-in-out infinite;
        }
        .wall-impact {
            animation: wallShake var(--anim-speed) ease-in-out infinite;
            transform-origin: 180px 160px;
        }
        .error-msg {
            animation: showError var(--anim-speed) steps(1) infinite;
        }

        /* DYNAMIC: The Spanning Flow */
        .flow-packet {
            animation: dataFlow var(--anim-speed) linear infinite;
            opacity: 0;
        }
        .dynamic-grow {
            animation: growVol var(--anim-speed) linear infinite;
        }

        /* --- KEYFRAMES --- */

        /* Basic */
        @keyframes hitWall {
            0%, 20% { width: 0; opacity: 0; }
            30% { width: 40px; opacity: 1; } /* Push */
            35% { width: 40px; transform: translateX(0); }
            40% { width: 40px; transform: translateX(-5px); } /* Bounce back */
            45% { width: 40px; transform: translateX(0); }
            80% { width: 40px; opacity: 1; }
            100% { width: 0; opacity: 0; }
        }
        @keyframes wallShake {
            0%, 30% { transform: translateX(0); fill: #94a3b8; }
            35% { transform: translateX(2px); fill: #ef4444; } /* Hit! */
            40% { transform: translateX(-2px); }
            45% { transform: translateX(0); }
            80% { fill: #94a3b8; }
        }
        @keyframes showError {
            0%, 30% { opacity: 0; }
            35% { opacity: 1; transform: scale(1.2); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; }
        }

        /* Dynamic */
        @keyframes dataFlow {
            0% { offset-distance: 0%; opacity: 1; }
            20% { offset-distance: 0%; opacity: 1; }
            60% { offset-distance: 100%; opacity: 1; }
            70% { opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes growVol {
            0%, 40% { height: 0; }
            60% { height: 60px; } /* Fills up Disk 2 */
            100% { height: 60px; }
        }

    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">

        <!-- Header -->
        <text x="400" y="40" class="header-title">TIPOS DE DISCO EN WINDOWS</text>
        <line x1="50" y1="55" x2="750" y2="55" stroke="#e2e8f0" stroke-width="2" />

        <!-- ================= LEFT: BASIC DISK ================= -->
        <g transform="translate(100, 100)">
            <text x="100" y="0" class="col-title" fill="#3b82f6">DISCO BÁSICO</text>
            <text x="100" y="20" class="label">Particiones Rígidas (Tabla MBR/GPT)</text>

            <!-- Physical Disk Rect -->
            <rect x="0" y="50" width="200" height="120" class="disk-body" />
            <text x="10" y="65" class="disk-label">Disco 0 (Físico)</text>

            <!-- Partition C (Fixed) -->
            <rect x="10" y="80" width="80" height="80" class="part-basic" />
            <text x="50" y="125" class="vol-text">C:</text>
            
            <!-- Partition D (The Obstacle) -->
            <rect x="100" y="80" width="90" height="80" class="part-blocked wall-impact" />
            <text x="145" y="125" class="vol-text" fill="#475569 !important">D:</text>
            <text x="145" y="140" font-size="9" fill="#475569" text-anchor="middle">(Datos)</text>

            <!-- Expansion Attempt -->
            <g transform="translate(60, 120)">
                 <rect x="0" y="-5" height="10" fill="#ef4444" class="expand-arrow" />
                 <!-- Arrow head simulation via polygon not easy with width anim, just using bar -->
            </g>

            <!-- Error Message -->
            <text x="100" y="220" class="error-text error-msg">X ¡BLOQUEADO!</text>
            <text x="100" y="240" class="label error-msg">Requiere espacio contiguo</text>

        </g>

        <!-- Divider -->
        <line x1="400" y1="100" x2="400" y2="350" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5" />

        <!-- ================= RIGHT: DYNAMIC DISK ================= -->
        <g transform="translate(500, 100)">
            <text x="100" y="0" class="col-title" fill="#d97706">DISCO DINÁMICO</text>
            <text x="100" y="20" class="label">Volúmenes Flexibles (LDM)</text>

            <!-- Physical Disk 1 -->
            <rect x="0" y="50" width="200" height="100" class="disk-body" />
            <text x="10" y="65" class="disk-label">Disco 1 (Dinámico)</text>

            <!-- Physical Disk 2 -->
            <rect x="0" y="180" width="200" height="100" class="disk-body" />
            <text x="10" y="195" class="disk-label">Disco 2 (Dinámico)</text>

            <!-- Volume Part A (Disk 1) -->
            <rect x="10" y="80" width="180" height="60" class="vol-dynamic" />
            <text x="100" y="115" class="vol-text">Volumen E: (Inicio)</text>

            <!-- Logic Link (Pipe) -->
            <path id="data-pipe" d="M 100 140 L 100 165 L 220 165 L 220 200 L 100 200 L 100 210" class="vol-link" />
            
            <!-- Volume Part B (Disk 2 - Growing) -->
            <rect x="10" y="210" width="180" height="0" class="vol-dynamic dynamic-grow" />
            <text x="100" y="245" class="vol-text dynamic-grow" style="opacity: 1">Volumen E: (Extendido)</text>

            <!-- Moving Packets -->
            <circle r="4" fill="#d97706" class="flow-packet">
                <animateMotion href="#data-pipe" dur="6s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#d97706" class="flow-packet" style="animation-delay: 0.5s">
                <animateMotion href="#data-pipe" dur="6s" repeatCount="indefinite" />
            </circle>

            <text x="100" y="310" class="label" fill="#d97706 !important" font-weight="bold">Spanned Volume / RAID Software</text>
        </g>

        <!-- ================= LEGEND ================= -->
        <g transform="translate(100, 380)">
            <rect x="0" y="0" width="600" height="60" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
            
            <!-- Basic Icon -->
            <rect x="20" y="15" width="15" height="15" fill="#3b82f6"/>
            <text x="45" y="27" font-size="11" font-weight="bold" fill="#334155">Básico:</text>
            <text x="90" y="27" font-size="11" fill="#475569">Limitado al disco físico. Fácil de recuperar con herramientas estándar.</text>

            <!-- Dynamic Icon -->
            <rect x="20" y="35" width="15" height="15" fill="#d97706"/>
            <text x="45" y="47" font-size="11" font-weight="bold" fill="#334155">Dinámico:</text>
            <text x="105" y="47" font-size="11" fill="#475569">Permite unir discos (Spanned), Espejo (RAID 1) o Striping (RAID 0).</text>
            <text x="105" y="59" font-size="10" fill="#ef4444">*Advertencia: Algunos sistemas operativos (Home) no los leen fácilmente.</text>
        </g>

    </svg>
</div>

</body>
</html>
