<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#f8f9fa" rx="15" ry="15"/>
  
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Esquema de Clonación: Windows 11 + Sysprep con Clonezilla</text>
  
  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="200" height="180" rx="10" ry="10" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">SERVIDOR SSH</text>
    
    <rect x="30" y="50" width="140" height="10" rx="2" fill="#95a5a6"/>
    <rect x="30" y="70" width="140" height="10" rx="2" fill="#95a5a6"/>
    <rect x="30" y="90" width="140" height="10" rx="2" fill="#95a5a6"/>
    
    <text x="100" y="130" font-family="monospace" font-size="14" text-anchor="middle" fill="#ecf0f1">IP: 10.1.6.248</text>
    <text x="100" y="150" font-family="monospace" font-size="12" text-anchor="middle" fill="#bdc3c7">/home/curso/clone</text>
    <text x="100" y="165" font-family="monospace" font-size="12" text-anchor="middle" fill="#bdc3c7">User: curso / Pass: qwerty</text>
  </g>

  <g transform="translate(40, 180)">
    <text x="80" y="-20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">FASE 1: PROFESOR</text>
    
    <rect x="0" y="0" width="160" height="120" rx="8" ry="8" fill="#ecf0f1" stroke="#e67e22" stroke-width="3"/>
    <text x="80" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">PC MAQUETA</text>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">Win 11 + Sysprep</text>
    <text x="80" y="80" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#777">Estado: Apagado</text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e67e22">Acción: savedisk</text>
  </g>

  <line x1="210" y1="240" x2="290" y2="240" stroke="#e67e22" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <text x="250" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e67e22">SUBIDA IMAGEN</text>

  <g transform="translate(600, 180)">
    <text x="80" y="-20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">FASE 2: ALUMNOS</text>
    
    <rect x="20" y="-10" width="160" height="120" rx="8" ry="8" fill="#fff" stroke="#95a5a6" stroke-width="1"/>
    <rect x="10" y="-5" width="160" height="120" rx="8" ry="8" fill="#fff" stroke="#95a5a6" stroke-width="1"/>
    
    <rect x="0" y="0" width="160" height="120" rx="8" ry="8" fill="#ecf0f1" stroke="#27ae60" stroke-width="3"/>
    <text x="80" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">15 x PCs AULA</text>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">HD: 80GB | RAM: 4GB</text>
    <text x="80" y="80" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#777">Config: EFI + 2 vCPU</text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">Acción: restoredisk</text>
  </g>

  <line x1="510" y1="240" x2="590" y2="240" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="550" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">DESCARGA IMAGEN</text>

  <rect x="50" y="400" width="700" height="70" rx="10" ry="10" fill="#dfe6e9" stroke="#b2bec3"/>
  <text x="70" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Configuración Común Clonezilla:</text>
  <text x="70" y="445" font-family="Arial, sans-serif" font-size="11" fill="#555">• Idioma: es_ES.UTF-8</text>
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="11" fill="#555">• Teclado: pc105 / es / No modifier</text>
  
  <text x="350" y="445" font-family="Arial, sans-serif" font-size="11" fill="#555">• Modo: Device-Image / SSH Server</text>
  <text x="350" y="460" font-family="Arial, sans-serif" font-size="11" fill="#555">• Red: DHCP</text>

  <defs>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60" />
    </marker>
  </defs>

</svg>
