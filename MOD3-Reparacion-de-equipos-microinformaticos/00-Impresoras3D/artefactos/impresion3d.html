<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Proceso de Impresión 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9;
        }
        .container-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        canvas {
            border-radius: 0.75rem;
            background-color: #ffffff;
            /* Ensure canvas is flexible */
            max-width: 100%;
            height: auto;
        }
    </style>
    <script type="module">
        // Importaciones de Firebase (requeridas)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Variables globales proporcionadas por el entorno
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth, userId = 'anon';

        // --- Configuración e Inicialización de Firebase (Boilerplate obligatorio) ---
        async function initializeFirebase() {
            try {
                // Configurar el nivel de log a Debug
                setLogLevel('Debug');

                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Autenticación: Usar token si está disponible, sino anónima
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                // Listener de estado de autenticación
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        console.log("Usuario autenticado. ID:", userId);
                        // Mostrar ID de usuario en la interfaz
                        document.getElementById('user-id-display').textContent = `ID de Usuario: ${userId}`;
                    } else {
                        userId = 'anon';
                        console.log("Usuario anónimo.");
                        document.getElementById('user-id-display').textContent = `ID de Usuario: anónimo`;
                    }
                    // Una vez que la autenticación está lista, podemos inicializar la simulación
                    initializeSimulation();
                });
            } catch (error) {
                console.error("Error al inicializar Firebase o autenticar:", error);
            }
        }
        // Llamar a la inicialización de Firebase
        initializeFirebase();

        // ----------------------------------------------------------------------
        // --- Lógica de Simulación de Impresión 3D (Canvas) ---
        // ----------------------------------------------------------------------

        const canvas = document.getElementById('printerCanvas');
        const ctx = canvas.getContext('2d');
        const stageTitle = document.getElementById('stage-title');
        const stageDescription = document.getElementById('stage-description');
        const nextButton = document.getElementById('next-stage-btn');
        const prevButton = document.getElementById('prev-stage-btn');

        let currentStage = 0;
        const totalStages = 3;
        let animationFrameId;

        const stages = [
            {
                title: "Fase 1: Diseño 3D (.STL)",
                description: "Se crea el modelo en un software CAD, el cual define la geometría de la pieza.",
                draw: drawDesign
            },
            {
                title: "Fase 2: Laminado (Slicer)",
                description: "El software 'corta' el modelo en capas finas y genera el código G con todas las instrucciones de impresión.",
                draw: drawSlicing
            },
            {
                title: "Fase 3: Impresión (Código G)",
                description: "La impresora lee el código G y deposita material, capa por capa, construyendo el objeto.",
                draw: drawPrinting
            }
        ];

        // Dimensiones del canvas para el dibujo (lógicas)
        const C_WIDTH = 400;
        const C_HEIGHT = 300;
        const CUBO_SIZE = 100;

        // Función para manejar el redimensionamiento del canvas y escalado
        function resizeCanvas() {
            const container = canvas.parentElement;
            // Usar un tamaño fijo para mejor visualización de la geometría 3D simulada
            canvas.width = container.clientWidth;
            canvas.height = Math.min(C_HEIGHT * (container.clientWidth / C_WIDTH), 500); // Altura máxima para evitar desbordamiento

            // Reiniciar el dibujo en la nueva escala
            renderStage(currentStage);
        }

        window.addEventListener('resize', resizeCanvas);

        function initializeSimulation() {
            // Se llama solo después de que Firebase ha intentado inicializarse
            resizeCanvas();
            renderStage(currentStage);
            
            nextButton.addEventListener('click', () => {
                currentStage = (currentStage + 1) % totalStages;
                renderStage(currentStage);
            });

            prevButton.addEventListener('click', () => {
                currentStage = (currentStage - 1 + totalStages) % totalStages;
                renderStage(currentStage);
            });
            
            // Iniciar la animación inicial (si aplica)
            animate();
        }

        // --- Funciones de Dibujo (Simulación) ---

        // Dibuja un cubo 3D simple (proyección isométrica)
        function drawCube(x, y, size, color) {
            // Escalar las coordenadas al tamaño actual del canvas
            const scaleX = canvas.width / C_WIDTH;
            const scaleY = canvas.height / C_HEIGHT;
            
            ctx.save();
            ctx.translate(x * scaleX, y * scaleY);
            ctx.scale(scaleX, scaleY);
            
            const OFFSET = size * 0.3; // Desplazamiento para perspectiva
            
            // Cara Inferior
            ctx.fillStyle = color + '40'; // Transparente
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, size);
            ctx.lineTo(size, size);
            ctx.lineTo(size + OFFSET, size - OFFSET);
            ctx.lineTo(OFFSET, size - OFFSET);
            ctx.closePath();
            ctx.fill();
            
            // Cara Frontal
            ctx.fillStyle = color + '80';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(size, 0);
            ctx.lineTo(size, size);
            ctx.lineTo(0, size);
            ctx.closePath();
            ctx.fill();
            
            // Cara Superior
            ctx.fillStyle = color + 'C0';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(OFFSET, -OFFSET);
            ctx.lineTo(size + OFFSET, -OFFSET);
            ctx.lineTo(size, 0);
            ctx.closePath();
            ctx.fill();
            
            // Contorno (para el wireframe)
            ctx.strokeStyle = color;
            ctx.beginPath();
            ctx.rect(0, 0, size, size); // Frontal
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(OFFSET, -OFFSET);
            ctx.moveTo(size, 0);
            ctx.lineTo(size + OFFSET, -OFFSET);
            ctx.moveTo(size, size);
            ctx.lineTo(size + OFFSET, size - OFFSET);
            ctx.stroke();
            
            ctx.restore();
        }

        // --- Etapa 1: Diseño 3D (Modelo .STL) ---
        function drawDesign() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "16px Inter";
            ctx.fillStyle = "#374151";
            ctx.textAlign = "center";
            
            // Título
            ctx.fillText("MODELO STL", canvas.width / 2, 40);
            
            // Dibujar el cubo
            drawCube(C_WIDTH / 2 - CUBO_SIZE / 2 - 20, C_HEIGHT / 2 - CUBO_SIZE / 2, CUBO_SIZE, "#3b82f6");
            
            // Etiqueta
            ctx.fillStyle = "#6b7280";
            ctx.fillText("Malla de Polígonos (Geometría)", canvas.width / 2, C_HEIGHT / 2 + 80);
        }
        
        // --- Etapa 2: Laminado (Slicing) ---
        function drawSlicing() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "16px Inter";
            ctx.fillStyle = "#374151";
            ctx.textAlign = "center";

            // Título
            ctx.fillText("PROCESO DE LAMINADO (SLICER)", canvas.width / 2, 40);

            // Dibujar el cubo base
            drawCube(C_WIDTH / 2 - CUBO_SIZE / 2 - 20, C_HEIGHT / 2 - CUBO_SIZE / 2, CUBO_SIZE, "#10b981");

            // Dibujar las capas (simulación del corte)
            const scaleX = canvas.width / C_WIDTH;
            const scaleY = canvas.height / C_HEIGHT;
            const startX = (C_WIDTH / 2 - CUBO_SIZE / 2 - 20) * scaleX;
            const startY = (C_HEIGHT / 2 - CUBO_SIZE / 2) * scaleY;
            const size = CUBO_SIZE * scaleX;
            
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 1;

            for (let i = 1; i < 10; i++) {
                const y = startY + (i * size) / 10;
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(startX + size, y);
                ctx.stroke();
            }

            // Etiqueta
            ctx.fillStyle = "#6b7280";
            ctx.fillText("Capas + Instrucciones (Código G)", canvas.width / 2, C_HEIGHT / 2 + 80);
        }

        // Variables de animación para la impresión
        let layerCount = 0;
        const maxLayers = 8;
        let animationTime = 0;

        // --- Etapa 3: Impresión (Ejecución del Código G) ---
        function drawPrinting(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "16px Inter";
            ctx.fillStyle = "#374151";
            ctx.textAlign = "center";

            // Título
            ctx.fillText("IMPRESIÓN CAPA POR CAPA", canvas.width / 2, 40);

            // Dibujar la base y la estructura
            const scaleX = canvas.width / C_WIDTH;
            const scaleY = canvas.height / C_HEIGHT;
            
            const startX = C_WIDTH / 2 - CUBO_SIZE / 2 - 20;
            const startY = C_HEIGHT / 2 + CUBO_SIZE / 2;
            const size = CUBO_SIZE;
            const layerHeight = size / maxLayers;

            // 1. Cama Caliente (Base)
            ctx.fillStyle = "#9ca3af"; // Gris oscuro
            ctx.fillRect(startX * scaleX - 10, startY * scaleY, (size + 20) * scaleX, 5 * scaleY);
            
            // 2. Objeto Impreso (Llamar a la función de dibujo de objeto animado)
            ctx.fillStyle = "#3b82f6"; // Azul
            for (let i = 0; i < layerCount; i++) {
                const y = startY - (i + 1) * layerHeight;
                ctx.fillRect(startX * scaleX, y * scaleY, size * scaleX, layerHeight * scaleY);
            }

            // 3. Extrusor Animado
            const extruderColor = "#ef4444";
            const extruderSize = 10;
            const extruderY = startY - (layerCount * layerHeight);
            
            // Movimiento lateral (simula la pasada del extrusor en X)
            const xOffset = Math.sin(timestamp * 0.005) * 40; 
            const extruderX = startX + size / 2 + xOffset;

            // Boquilla (Nozzle)
            ctx.fillStyle = extruderColor;
            ctx.beginPath();
            ctx.arc(extruderX * scaleX, extruderY * scaleY - extruderSize * scaleY, extruderSize * scaleX / 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Cabezal del extrusor
            ctx.fillRect((extruderX - extruderSize * 1.5) * scaleX, (extruderY - extruderSize * 3) * scaleY, extruderSize * 3 * scaleX, extruderSize * 2 * scaleY);

            // Simular deposición (línea roja temporal)
            ctx.strokeStyle = extruderColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(extruderX * scaleX, extruderY * scaleY);
            ctx.lineTo(extruderX * scaleX, extruderY * scaleY + 1); // La capa actual
            ctx.stroke();


            // Lógica de avance de capa
            if (layerCount < maxLayers && Math.random() < 0.01) { // Lento avance aleatorio
                layerCount++;
            }

            // Etiqueta
            ctx.fillStyle = "#6b7280";
            ctx.fillText(`Capa actual: ${layerCount} de ${maxLayers}`, canvas.width / 2, C_HEIGHT / 2 + 130);

        }
        
        // Función principal de renderizado
        function renderStage(stageIndex) {
            cancelAnimationFrame(animationFrameId); // Detener cualquier animación anterior
            layerCount = 0; // Resetear la capa al cambiar de etapa

            const stage = stages[stageIndex];
            stageTitle.textContent = stage.title;
            stageDescription.textContent = stage.description;
            
            if (stageIndex === 2) {
                // Iniciar animación para la fase de Impresión
                animationFrameId = requestAnimationFrame(animate);
            } else {
                // Dibujo estático para las otras fases
                stage.draw();
            }

            // Actualizar estado de los botones (opcional)
            prevButton.disabled = stageIndex === 0;
            nextButton.disabled = stageIndex === totalStages - 1;
        }

        function animate(timestamp) {
            if (currentStage === 2) {
                drawPrinting(timestamp);
                animationFrameId = requestAnimationFrame(animate);
            }
        }
    </script>
</head>
<body class="p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl container-shadow">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Proceso de Impresión 3D: Simulador</h1>
        <p class="text-sm text-center text-gray-500 mb-6" id="user-id-display">ID de Usuario: ...</p>
        
        <!-- Contenedor de la Etapa -->
        <div class="mb-6 p-4 bg-blue-50 border-l-4 border-blue-500 rounded-lg">
            <h2 id="stage-title" class="text-xl font-semibold text-gray-800">Fase 1: Diseño 3D (.STL)</h2>
            <p id="stage-description" class="text-gray-600 mt-1">Se crea el modelo en un software CAD, el cual define la geometría de la pieza.</p>
        </div>

        <!-- Canvas de Visualización -->
        <div class="flex justify-center mb-6 border border-gray-200 rounded-xl p-4">
            <canvas id="printerCanvas" width="800" height="600" class="w-full h-auto"></canvas>
        </div>

        <!-- Controles de Navegación -->
        <div class="flex justify-between space-x-4">
            <button id="prev-stage-btn" disabled
                class="flex-1 bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition duration-150 ease-in-out hover:bg-gray-400 disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Anterior
            </button>
            <button id="next-stage-btn"
                class="flex-1 bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-150 ease-in-out hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                Siguiente &rarr;
            </button>
        </div>
    </div>

</body>
</html>
